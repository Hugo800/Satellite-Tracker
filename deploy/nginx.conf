# TLE-Spiegel (siehe location /tle/gp.php). Liegt im http-Kontext: conf.d wird dort eingebunden.
proxy_cache_path /var/cache/nginx/tle levels=1 keys_zone=tle:1m max_size=200m inactive=14d use_temp_path=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # nginx:alpine kennt .webmanifest nicht (sonst application/octet-stream).
    include /etc/nginx/mime.types;
    types { application/manifest+json webmanifest; }
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Gehashte Build-Dateien dürfen lange im Cache bleiben.
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    # Service Worker, Manifest und Einstieg immer frisch prüfen, sonst hängen PWA-Updates.
    location ~ ^/(sw\.js|registerSW\.js|workbox-.*\.js|manifest\.webmanifest|index\.html)$ {
        add_header Cache-Control "no-cache";
    }

    # TLE-Spiegel für CelesTrak. CelesTrak sperrt IPs, die dieselbe Gruppe innerhalb des
    # 2-Stunden-Update-Intervalls erneut laden (HTTP 403). Über den Spiegel fragt nur noch
    # dieser Server an, höchstens einmal je Gruppe und Intervall, und alle Geräte teilen
    # sich die Antwort. Scheitert CelesTrak, bleibt die letzte gute Fassung in Auslieferung.
    # Nur die Gruppen aus src/data/tleSources.ts – kein offener Proxy.
    location = /tle/gp.php {
        if ($args !~ "^GROUP=(stations|visual|weather|starlink|active)&FORMAT=tle$") { return 400; }

        # Namensauflösung zur Laufzeit (Docker-DNS): Ist celestrak.org beim Start nicht
        # auflösbar, startet nginx trotzdem und die App bleibt erreichbar.
        resolver 127.0.0.11 valid=300s ipv6=off;
        set $celestrak celestrak.org;
        proxy_pass https://$celestrak/NORAD/elements/gp.php?$args;
        proxy_set_header Host celestrak.org;
        proxy_set_header Cookie "";
        proxy_set_header User-Agent "OrbitalAtlas/1.0 (+https://tracker.hugobarthelmess.de)";
        proxy_ssl_server_name on;
        proxy_ssl_name celestrak.org;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_read_timeout 120s;

        proxy_cache tle;
        proxy_cache_key $args;
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
        proxy_hide_header Set-Cookie;
        proxy_cache_valid 200 2h;
        proxy_cache_use_stale error timeout updating http_403 http_429 http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 120s;

        add_header X-Cache-Status $upstream_cache_status always;
        add_header Cache-Control "no-cache" always;
    }

    location / { try_files $uri $uri/ /index.html; }
}
